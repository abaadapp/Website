# abaadapp.om و www — يحلّ محلّ كتلة `server_name abaadapp.om www.abaadapp.om;`
# في /etc/nginx/sites-available/abaad. كتلة app.abaadapp.om وكتلة المنفذ 80
# (default_server → https) تبقيان كما هما بلا أيّ تغيير.
#
# الشهادة نفسها: abaadapp.om تحمل الأسماء الثلاثة (abaadapp.om وwww وapp).
# ولا كتلةَ جديدة على المنفذ 80: تجديدُ Let's Encrypt (المصادِق nginx) يعمل كما اليوم.

# www → abaadapp.om، بالمسار والاستعلام
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.abaadapp.om;

    ssl_certificate /etc/letsencrypt/live/abaadapp.om/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/abaadapp.om/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://abaadapp.om$request_uri;
}

# الموقع التعريفي — ملفّات ثابتة، لا PHP ولا جلسات
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name abaadapp.om;
    root /var/www/abaad-website;
    index index.html;
    charset utf-8;

    ssl_certificate /etc/letsencrypt/live/abaadapp.om/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/abaadapp.om/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ملفّات المستودع التي ليست من الموقع
    location ~ ^/(README\.md|package(-lock)?\.json|tools/|tests/|deploy/|node_modules/) { return 404; }

    # من يكتب الدخول أو التسجيل على الموقع يصل إلى النظام
    location = /login    { return 301 https://app.abaadapp.om/login; }
    location = /register { return 301 https://app.abaadapp.om/register; }

    location ~* \.(js|css|svg|png|jpg|jpeg|webp|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }
    # رابطٌ لا صفحةَ له يُردّ بـ404 لا بالرئيسية: كانت كلُّ كتابةٍ خاطئة (/nope، /web قبل صفحتها)
    # صفحةً رئيسيّةً ثانية برمز 200 — نسخٌ مكرّرة لا نهاية لها في نظر محرّكات البحث.
    location / { try_files $uri $uri/ =404; }
    error_page 404 /404.html;
    location = /404.html { internal; }
    location ~ /\.(?!well-known).* { deny all; }
}
